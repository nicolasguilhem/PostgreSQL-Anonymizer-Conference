name: Build and deploy slides latest version

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️ 👉
        uses: actions/checkout@v4

      - name: Install required dependencies
        run: ./setup.sh

      - name: Build 🔧
        uses: addnab/docker-run-action@v3
        with:
          image: asciidoctor/docker-asciidoctor:1.101.0
          options: -v ${{ github.workspace }}:/documents
          run: asciidoctor-revealjs index.adoc

      - name: Copy build to folder 📦
        run: |
          TARGET_DIR=build/${{ github.ref_name }} && \
          mkdir -p $TARGET_DIR/reveal.js/dist && \
          cp -r *.html images css fonts $TARGET_DIR/ && \
          cp -r reveal.js/dist/* $TARGET_DIR/reveal.js/dist/ && \
          cp -r reveal.js/plugin $TARGET_DIR/reveal.js/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          folder: build
          branch: gh-pages
          clean: false
